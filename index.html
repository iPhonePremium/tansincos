
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三角比計算機</title>
<style>
*{box-sizing:border-box}

body{
 margin:0;
 padding:18px;
 font-family:system-ui,"Noto Sans JP",sans-serif;
 background:linear-gradient(135deg,#dbeafe,#f3e8ff);
 color:#172033;
}

.container{max-width:720px;margin:auto}

h1{text-align:center;font-size:clamp(25px,7vw,38px)}
.subtitle{text-align:center;color:#64748b;margin-bottom:25px}

.card{
 background:white;
 border-radius:22px;
 padding:22px;
 margin-bottom:18px;
 box-shadow:0 8px 30px #33415512;
}

h2{font-size:20px;margin:0 0 18px}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:14px;
}

label{
 display:block;
 font-weight:bold;
 font-size:14px;
 margin-bottom:6px;
}

input,button{
 width:100%;
 padding:13px;
 border-radius:12px;
 font:inherit;
}

input{
 border:1px solid #cbd5e1;
 background:#f8fafc;
}

button{
 margin-top:16px;
 border:0;
 background:#2563eb;
 color:white;
 font-weight:bold;
 cursor:pointer;
}

button:hover{background:#1d4ed8}

.result{
 background:#eff6ff;
 border:1px solid #bfdbfe;
 border-radius:16px;
 padding:18px;
 margin-top:18px;
}

.result h3{
 margin:0 0 14px;
 color:#1d4ed8;
}

.line{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 padding:14px 0;
 border-bottom:1px solid #dbeafe;
 flex-wrap:wrap;
}

.line:last-child{border-bottom:0}

.symbol{
 font-size:20px;
 font-weight:bold;
}

.value{
 font-size:25px;
 font-weight:bold;
 color:#1d4ed8;
 display:flex;
 align-items:center;
 justify-content:center;
 min-width:70px;
}

.decimal{
 font-size:13px;
 color:#64748b;
}

.error{
 color:#dc2626;
 font-size:14px;
 margin-top:10px;
}

.steps{
 background:#f8fafc;
 border-radius:14px;
 padding:15px;
 margin-top:14px;
 line-height:2;
 overflow-wrap:anywhere;
}

.note{
 font-size:13px;
 color:#64748b;
 line-height:1.8;
}

/* 本物の分数表示 */
.frac{
 display:inline-flex;
 flex-direction:column;
 align-items:center;
 vertical-align:middle;
 line-height:1.15;
 font-size:1em;
 min-width:24px;
}

.frac .top{
 padding:0 5px 3px;
 border-bottom:2px solid currentColor;
}

.frac .bottom{
 padding:3px 5px 0;
}

.root{white-space:nowrap}

@media(max-width:480px){
 body{padding:12px}
 .card{padding:16px}
 .grid{gap:10px}
 .line{justify-content:space-between}
}
</style>
</head>

<body>
<div class="container">

<h1>📐 三角比計算機</h1>
<p class="subtitle">sin A・cos A・tan A を分数で計算！</p>

<div class="card">
<h2>① 角度から求める</h2>

<label for="angle">角度 A（度）</label>
<input id="angle" type="number" min="0" max="89.999999"
step="any" value="30">

<button onclick="calcAngle()">計算する</button>
<div id="angleError" class="error"></div>

<div class="result">
<h3>計算結果</h3>

<div class="line">
<span class="symbol">sin A</span>
<span class="value" id="sinAngle"></span>
<span class="decimal" id="sinDec"></span>
</div>

<div class="line">
<span class="symbol">cos A</span>
<span class="value" id="cosAngle"></span>
<span class="decimal" id="cosDec"></span>
</div>

<div class="line">
<span class="symbol">tan A</span>
<span class="value" id="tanAngle"></span>
<span class="decimal" id="tanDec"></span>
</div>

</div>
</div>

<div class="card">
<h2>② 辺の長さから求める</h2>

<p class="note">
分数で入力できます。例：3/4、1/2<br>
整数を入力すると、答えも分数で表示します。
</p>

<div class="grid">
<div>
<label for="opposite">向かい側の辺</label>
<input id="opposite" value="3" placeholder="例：3">
</div>

<div>
<label for="adjacent">となりの辺</label>
<input id="adjacent" value="4" placeholder="例：4">
</div>
</div>

<div style="margin-top:14px">
<label for="hypotenuse">斜辺</label>
<input id="hypotenuse" value="5" placeholder="例：5">
</div>

<button onclick="calcSides()">計算する</button>
<div id="sideError" class="error"></div>

<div class="result">
<h3>計算結果</h3>

<div class="line">
<span class="symbol">sin A</span>
<span class="value" id="sinSide"></span>
<span class="decimal" id="sinSideDec"></span>
</div>

<div class="line">
<span class="symbol">cos A</span>
<span class="value" id="cosSide"></span>
<span class="decimal" id="cosSideDec"></span>
</div>

<div class="line">
<span class="symbol">tan A</span>
<span class="value" id="tanSide"></span>
<span class="decimal" id="tanSideDec"></span>
</div>

</div>
</div>

<div class="card">
<h2>③ よく使う三角比</h2>

<div class="steps">

<b>30°</b><br>
sin30° =
<span class="frac"><span class="top">1</span><span class="bottom">2</span></span>
<br>
cos30° =
<span class="frac"><span class="top">√3</span><span class="bottom">2</span></span>
<br>
tan30° =
<span class="frac"><span class="top">√3</span><span class="bottom">3</span></span>

<br><br>

<b>45°</b><br>
sin45° =
<span class="frac"><span class="top">√2</span><span class="bottom">2</span></span>
<br>
cos45° =
<span class="frac"><span class="top">√2</span><span class="bottom">2</span></span>
<br>
tan45° = 1

<br><br>

<b>60°</b><br>
sin60° =
<span class="frac"><span class="top">√3</span><span class="bottom">2</span></span>
<br>
cos60° =
<span class="frac"><span class="top">1</span><span class="bottom">2</span></span>
<br>
tan60° = √3

</div>
</div>

</div>

<script>

// =====================
// 分数の計算
// =====================

function gcd(a,b){
 a=Math.abs(a);
 b=Math.abs(b);

 while(b){
  let t=a%b;
  a=b;
  b=t;
 }

 return a||1;
}

function frac(n,d=1){
 if(d<0){
  n=-n;
  d=-d;
 }

 let g=gcd(n,d);

 return {
  n:n/g,
  d:d/g
 };
}

// 分数をHTMLで表示
function fractionHTML(n,d=1){

 if(d===0)return "定義されない";

 if(d<0){
  n=-n;
  d=-d;
 }

 let g=gcd(n,d);
 n/=g;
 d/=g;

 if(d===1)return String(n);

 return `
 <span class="frac">
   <span class="top">${n}</span>
   <span class="bottom">${d}</span>
 </span>
 `;
}

// 入力を数値に変換
function parseNum(text){

 text=String(text).trim().replace(/\s/g,"");

 if(!text)return NaN;

 // 分数
 if(text.includes("/")){

  let p=text.split("/");

  if(p.length!==2)return NaN;

  let a=parseNum(p[0]);
  let b=parseNum(p[1]);

  if(!Number.isFinite(a)||!Number.isFinite(b)||b===0){
   return NaN;
  }

  return a/b;
 }

 // √3
 if(text.startsWith("√")){
  return Math.sqrt(Number(text.slice(1)));
 }

 // sqrt(3)
 if(text.startsWith("sqrt(")&&text.endsWith(")")){
  return Math.sqrt(Number(text.slice(5,-1)));
 }

 return Number(text);
}

function fmt(n){

 if(!Number.isFinite(n))return "定義されない";

 return Number(n.toFixed(10)).toString();

}

// =====================
// 特別角
// =====================

function exactTrig(angle){

 const a=Number(angle.toFixed(8));

 if(a===0){
  return [
   fractionHTML(0),
   fractionHTML(1),
   fractionHTML(0)
  ];
 }

 if(a===30){
  return [
   fractionHTML(1,2),
   fractionHTML(3,2).replace("3","√3"),
   fractionHTML(1,3).replace("1","√3")
  ];
 }

 if(a===45){
  return [
   fractionHTML(2,2).replace("2","√2"),
   fractionHTML(2,2).replace("2","√2"),
   "1"
  ];
 }

 if(a===60){
  return [
   fractionHTML(3,2).replace("3","√3"),
   fractionHTML(1,2),
   "√3"
  ];
 }

 return null;
}

// =====================
// ① 角度から計算
// =====================

function calcAngle(){

 const angle=Number(document.getElementById("angle").value);
 const error=document.getElementById("angleError");

 error.textContent="";

 if(!Number.isFinite(angle)||angle<0||angle>=90){
  error.textContent="0以上90未満の角度を入力してください。";
  return;
 }

 const rad=angle*Math.PI/180;

 const s=Math.sin(rad);
 const c=Math.cos(rad);
 const t=Math.tan(rad);

 const exact=exactTrig(angle);

 if(exact){

  document.getElementById("sinAngle").innerHTML=exact[0];
  document.getElementById("cosAngle").innerHTML=exact[1];
  document.getElementById("tanAngle").innerHTML=exact[2];

 }else{

  document.getElementById("sinAngle").textContent=fmt(s);
  document.getElementById("cosAngle").textContent=fmt(c);
  document.getElementById("tanAngle").textContent=fmt(t);

 }

 document.getElementById("sinDec").textContent="= "+fmt(s);
 document.getElementById("cosDec").textContent="= "+fmt(c);
 document.getElementById("tanDec").textContent="= "+fmt(t);

}

// =====================
// ② 辺から計算
// =====================

function calcSides(){

 const oText=document.getElementById("opposite").value;
 const aText=document.getElementById("adjacent").value;
 const hText=document.getElementById("hypotenuse").value;

 const o=parseNum(oText);
 const a=parseNum(aText);
 const h=parseNum(hText);

 const error=document.getElementById("sideError");

 error.textContent="";

 if(!Number.isFinite(o)||!Number.isFinite(a)||!Number.isFinite(h)||
    o<0||a<=0||h<=0){

  error.textContent="正しい辺の長さを入力してください。";
  return;

 }

 if(h*h<o*o+a*a-1e-8){

  error.textContent="斜辺が短すぎます。";
  return;

 }

 const sin=o/h;
 const cos=a/h;
 const tan=o/a;

 // 入力が分数・整数なら分数表示
 const of=parseFraction(oText);
 const af=parseFraction(aText);
 const hf=parseFraction(hText);

 if(of&&af&&hf){

  document.getElementById("sinSide").innerHTML=
   fractionHTML(of.n*hf.d,of.d*hf.n);

  document.getElementById("cosSide").innerHTML=
   fractionHTML(af.n*hf.d,af.d*hf.n);

  document.getElementById("tanSide").innerHTML=
   fractionHTML(of.n*af.d,of.d*af.n);

 }else{

  document.getElementById("sinSide").textContent=fmt(s);
  document.getElementById("cosSide").textContent=fmt(c);
  document.getElementById("tanSide").textContent=fmt(t);

 }

 document.getElementById("sinSideDec").textContent="= "+fmt(s);
 document.getElementById("cosSideDec").textContent="= "+fmt(c);
 document.getElementById("tanSideDec").textContent="= "+fmt(t);

}

// 分数・整数として読み取れるか
function parseFraction(text){

 text=String(text).trim().replace(/\s/g,"");

 if(/^-?\d+$/.test(text)){
  return frac(Number(text),1);
 }

 if(/^-?\d+\/-?\d+$/.test(text)){

  let p=text.split("/");

  let n=Number(p[0]);
  let d=Number(p[1]);

  if(d===0)return null;

  return frac(n,d);
 }

 return null;

}

calcAngle();
calcSides();

</script>

</body>
</html>
